name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Packages with test targets. Both run against mocks, so they need
        # neither Firebase configuration nor a simulator.
        package:
          - DomainLayer/SharedDomain
          - DataLayer/Repositories/ActivityRepository
    steps:
      - uses: actions/checkout@v4

      # The manifests need swift-tools 6.2, which ships with Xcode 26+.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: swift test
